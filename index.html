<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./src/main.ts" type="module"></script>
    <title>vite-project</title>
  </head>
  <body>
    <div class="container mx-auto p-8">
      <h1 class="text-4xl text-amber-100 font-bold font-roboto">Hello World</h1>

      <div class="bg-jet-black-500 mt-2 rounded-lg p-2">
        <p class="text-cool-steel-300 font-caveat text-xl">
          Este panel utiliza una utilidad personalizada y tus colores de tema.
        </p>
        <button
          class="mt-4 p-2 bg-jet-black-400 hover:bg-jet-black-300 rounded"
        >
          Botón con variante activa
        </button>
      </div>
    </div>

    <div class="container mx-auto p-8 w-1/3 hidden id="form">
      <form action="" class="bg-jet-black-500 rounded-xl p-4">
        <div class="flex flex-col  gap-2">
        <label for="nombre" class="font-roboto">Nombre</label>
        <input
          type="text"
          id="nombre"
          class="bg-jet-black-400 h-10"
          placeholder="Nombre"
        />
        <label for="email" class="mt-4 font-anton">Email</label>
        <input
          type="email"
          id="email"
          class="bg-jet-black-400  h-10"
          placeholder="Email"
        />
        <button type="submit" class="
        m-auto mt-5 rounded-xl
        bg-jet-black-400 hover:bg-jet-black-900 hover:text-white hover:transform hover:scale-120
        p-2 w-1/3 align-middle font-mono font-bold text-xl">Enviar</button>
      </form>
    </div>
  </body>
</html>
